info:
  title: Joseph Liao
  author: Joseph Liao
  subtitle: Network Engineer | SDE
  url: https://github.com/Joseph-ljx

defaults:
  favicon: /images/logo_3.png
  logo: /images/logo_3_transparent.png
  avatar: /images/avatar_1.png

home_banner:
  enable: true
  style: fixed
  image:
    light: /images/background_4.png
    dark: /images/background_4.png
  title: :)
  subtitle:
    text:
      - "Current Network and Automation Engineer "
      - "Open to Collaborations "
  text_color:
    light: "#ffffff"
    dark: "#d1d1b6"
  text_style:
    title_size: 3.5rem
    subtitle_size: 1.8rem
  social_links:
    enable: true
    links:
      github: https://github.com/Joseph-ljx
      fa-brands fa-linkedin: https://www.linkedin.com/in/joseph-liao/
      fa-brands fa-kaggle: https://www.kaggle.com/ljx02263

navbar:
  auto_generate: false
  auto_hide: false
  links:
    EXPERIENCE:
      path: /archives/
      icon: fa-regular fa-folder-open
    SKILLS:
      path: /tags/
      icon: fa-solid fa-tags
    RESUME:
      icon: fa-regular fa-user
      path: /about/
    OTHER:
      icon: fa-regular fa-link
      submenus:
        LINKEDIN: https://www.linkedin.com/in/joseph-liao/
        GITHUB: https://github.com/Joseph-ljx
        GALLERY: /masonry/

articles:
  word_count:
    enable: false
    min2read: false
  author_label:
    list: ["Network Engineer"]

page_templates:
  tags_style: blur

search:
  enable: true
  preload: true

plugins:
  link_handle:
    enable: false
  aplayer:
    enable: true
    type: fixed
    autoplay: false
    audios:
      - name: Passionfruit
        artist: Drake
        url: /music/BGM_2.mp3
        cover: /images/BGM.png

inject:
  enable: true
  head:
    - <link rel="stylesheet" href="/css/nav-home-banner.css">
    - <link rel="stylesheet" href="/css/particles-background.css">
    - <link rel="stylesheet" href="/css/toc-performance.css">
    - <link rel="stylesheet" href="/css/tags-page.css">
    - <link rel="stylesheet" href="/css/gallery.css">
  footer:
    - <script defer src="/js/nav-home-banner.js"></script>
    - <script defer src="/js/particles-background.js"></script>
    - <script defer src="/js/toc-performance.js"></script>

comment:
  enable: false
